name: Publish

on:
  push:
    branches:
      - main
    paths:
      - package.json
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to checkout and publish (e.g. v0.8.1). Omit to use the default branch."
        required: false
        type: string

jobs:
  resolve:
    name: resolve-version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.pkg.outputs.version }}
      already_published: ${{ steps.guard.outputs.already_published }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref != '' && inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Read package version
        id: pkg
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "package.json version: $VERSION"

      - name: Check if version already on npm
        id: guard
        env:
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          set -euo pipefail
          if PUBLISHED="$(npm view "opencircom@${VERSION}" version 2>/dev/null || true)" && [ "$PUBLISHED" = "$VERSION" ]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "opencircom@${VERSION} is already on npm; downstream publish will be skipped."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "opencircom@${VERSION} is not on npm yet."
          fi

  publish:
    name: publish
    needs: resolve
    if: needs.resolve.outputs.already_published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: publish-npm-${{ needs.resolve.outputs.version }}
      cancel-in-progress: false
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      version: ${{ needs.resolve.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref != '' && inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Upgrade npm for Trusted Publishing
        run: |
          npm install -g "npm@>=11.5.1 <12"
          npm --version

      - name: Install Circom
        run: |
          set -euxo pipefail
          curl -fsSL -o /tmp/circom \
            https://github.com/iden3/circom/releases/download/v2.2.3/circom-linux-amd64
          chmod +x /tmp/circom
          sudo mv /tmp/circom /usr/local/bin/circom
          circom --version

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Compile test circuits, setup ZK, run mocha
        run: npm test

      - name: Verify package version matches release tag
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.ref != '')
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            EXPECTED="${TAG#v}"
            if [ "$PKG_VERSION" != "$EXPECTED" ]; then
              echo "package.json version ($PKG_VERSION) does not match tag ($TAG → expected $EXPECTED)"
              exit 1
            fi
            echo "Publishing version $PKG_VERSION for tag $TAG"
          else
            REF="${{ inputs.ref }}"
            EXPECTED="${REF#v}"
            if [ "$PKG_VERSION" != "$EXPECTED" ]; then
              echo "package.json version ($PKG_VERSION) does not match ref ($REF → expected $EXPECTED)"
              exit 1
            fi
            echo "Publishing version $PKG_VERSION for ref $REF"
          fi

      - name: Re-check npm before publish
        id: recheck
        run: |
          set -euo pipefail
          if PUBLISHED="$(npm view "opencircom@${version}" version 2>/dev/null || true)" && [ "$PUBLISHED" = "$version" ]; then
            echo "skip_publish=true" >> "$GITHUB_OUTPUT"
            echo "opencircom@${version} appeared on npm while tests ran; skipping publish."
          else
            echo "skip_publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assert OIDC-only npm config (no token .npmrc)
        if: steps.recheck.outputs.skip_publish != 'true'
        run: |
          set -euo pipefail
          for f in "$HOME/.npmrc" .npmrc; do
            if [ -f "$f" ] && grep -qF '_authToken' "$f"; then
              echo "Token-based auth found in $f; Trusted Publishing (OIDC) only."
              exit 1
            fi
          done
          npm --version
          npm config get registry

      - name: Publish to npm
        if: steps.recheck.outputs.skip_publish != 'true'
        run: |
          set -euo pipefail
          LATEST="$(npm view opencircom version)"
          echo "npm latest: $LATEST; publishing: $version"
          if [ "$(printf '%s\n' "$LATEST" "$version" | sort -V | head -n1)" = "$version" ] && [ "$version" != "$LATEST" ]; then
            echo "Version $version is older than npm latest ($LATEST); publishing with dist-tag backfill"
            npm publish --provenance --access public --tag backfill
          else
            npm publish --provenance --access public
          fi

      - name: Confirm publication on npm
        if: steps.recheck.outputs.skip_publish != 'true'
        run: |
          set -euo pipefail
          DELAYS="0 5 10 20 30 55"
          PUBLISHED=""
          for delay in $DELAYS; do
            if [ "$delay" -gt 0 ]; then
              echo "Waiting ${delay}s for npm registry…"
              sleep "$delay"
            fi
            PUBLISHED="$(npm view "opencircom@${version}" version 2>/dev/null || true)"
            if [ "$PUBLISHED" = "$version" ]; then
              echo "Confirmed opencircom@${version} on npm"
              exit 0
            fi
            echo "opencircom@${version} not visible yet (got: ${PUBLISHED:-<empty>})"
          done
          echo "Expected opencircom@${version} to be $version, got $PUBLISHED"
          exit 1