name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Circom
        run: |
          set -euxo pipefail
          curl -fsSL -o /tmp/circom \
            https://github.com/iden3/circom/releases/download/v2.2.3/circom-linux-amd64
          chmod +x /tmp/circom
          sudo mv /tmp/circom /usr/local/bin/circom
          circom --version

      - name: Install npm dependencies
        run: npm ci

      - name: Compile test circuits, setup ZK, run mocha
        run: npm test
